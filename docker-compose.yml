version: '3.8'

services:
  bot:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    restart: always
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

volumes:
  postgres_data: